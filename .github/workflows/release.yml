name: Build Windows launcher release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installer and portable launcher
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ViceTogether-Windows
          path: |
            ../../work/release/*Setup.exe
            ../../work/release/*portable.exe
            ../../work/release/*.blockmap
            ../../work/release/latest.yml
      - name: Publish tagged update
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne "v$version") { throw 'Tag and package version must match.' }
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo '${{ github.repository }}' --title "ViceTogether $version — experimental" --notes-file RELEASE-NOTES.md --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $files = Get-ChildItem ../../work/release -File | Where-Object { $_.Name -match '(Setup\.exe|portable\.exe|\.blockmap|latest\.yml)$' }
          if (!$files.Count) { throw 'Release files are missing.' }
          gh release upload $tag @($files.FullName) --repo '${{ github.repository }}' --clobber
          exit $LASTEXITCODE
