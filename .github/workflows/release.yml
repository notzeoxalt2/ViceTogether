name: Build Windows launcher release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Checkout pinned reVC engine source
        uses: actions/checkout@v4
        with:
          repository: mrxenginner/reVC
          ref: a26fff4af555a8a425ac9f17d1dd718d00d1f942
          path: native-engine-source
          submodules: true
      - name: Build the updated native engine
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'native-engine-source'
          $patch = Join-Path $PWD 'engine/native-source/native-engine.patch'
          git -C $source apply --exclude=src/skel/win/win.rc $patch
          if ($LASTEXITCODE -ne 0) { throw 'Native engine patch did not apply.' }
          Copy-Item engine/native-source/ViceTogether.cpp,engine/native-source/ViceTogether.h,engine/native-source/ViceTogetherNetwork.cpp,engine/native-source/ViceTogetherWorld.cpp,engine/native-source/ViceTogetherWorld.h -Destination native-engine-source/src/core -Force
          Copy-Item engine/native-source/vice-together.ico -Destination native-engine-source/src/skel/win/vice-together.ico -Force
          $resource = Join-Path $source 'src/skel/win/win.rc'
          $resourceText = [System.IO.File]::ReadAllText($resource)
          if (!$resourceText.Contains('"gtavc.ico"')) { throw 'Expected upstream Windows icon reference was not found.' }
          [System.IO.File]::WriteAllText($resource, $resourceText.Replace('"gtavc.ico"','"vice-together.ico"'), [System.Text.UTF8Encoding]::new($false))
          $build = Join-Path $source 'build'
          $milesSdk = Join-Path $source 'vendor/milessdk'
          cmake -S $source -B $build -G "Visual Studio 17 2022" -A Win32 -DLIBRW_PLATFORM=D3D9 -DREVC_AUDIO=MSS "-DMilesSDK_DIR=$milesSdk" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DREVC_WITH_OPUS=OFF -DLIBRW_TOOLS=OFF -DLIBRW_INSTALL=OFF -DREVC_INSTALL=OFF
          if ($LASTEXITCODE -ne 0) { throw 'Native engine CMake configuration failed.' }
          cmake --build $build --config Release --target reVC --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Native engine build failed.' }
          $engine = Get-ChildItem $build -Filter reVC.exe -Recurse | Select-Object -First 1
          if (!$engine) { throw 'Native engine executable was not produced.' }
          Copy-Item -LiteralPath $engine.FullName -Destination engine/native/reVC.exe -Force
      - run: npm ci
      - run: npm test
      - name: Build installer and portable launcher
        run: npm run dist -- --config.directories.output=dist
      - name: Keep existing launchers compatible with the published feed
        shell: pwsh
        run: Copy-Item -LiteralPath dist/alpha.yml -Destination dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: ViceTogether-Windows
          path: |
            dist/*Setup.exe
            dist/*portable.exe
            dist/*.blockmap
            dist/alpha.yml
            dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: ViceTogether-NativeEngine-Test
          path: engine/native/reVC.exe
          retention-days: 3
      - name: Publish tagged update
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -ne "v$version") { throw 'Tag and package version must match.' }
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo '${{ github.repository }}' --title "ViceTogether $version — experimental" --notes-file RELEASE-NOTES.md --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -match '(Setup\.exe|portable\.exe|\.blockmap|alpha\.yml|latest\.yml)$' }
          if (!$files.Count) { throw 'Release files are missing.' }
          gh release upload $tag @($files.FullName) --repo '${{ github.repository }}' --clobber
          exit $LASTEXITCODE
